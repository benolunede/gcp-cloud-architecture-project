name: GCP Cloud Code Validation

# Trigger this workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
    
    # Step 1: Checkout the code from repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Install and configure Python for Mt 2/3 validation
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Lint Python Code
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        # Stop the build if there are Python syntax errors
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # Step 3: Install and initialize Terraform for Mt 1 validation
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Validate Terraform Syntax
      run: |
        cd mt1-terraform
        terraform init -backend=false
        terraform validate
